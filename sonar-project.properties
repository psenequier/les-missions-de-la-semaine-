# SonarCloud : analyse lancée par la CI (job « sonar » de .github/workflows/ci.yml).
sonar.organization=psenequier
sonar.projectKey=psenequier_les-missions-de-la-semaine-
sonar.projectName=Points en famille
sonar.sources=.
sonar.tests=tests,supabase/tests
sonar.exclusions=tests/**,supabase/tests/**,node_modules/**
sonar.sourceEncoding=UTF-8

# Couverture : relevée par Chromium pendant les tests d'interface (tests/ui/couverture.mjs).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# config.js ne contient que des réglages ; les scripts de CI ne tournent pas dans le site.
sonar.coverage.exclusions=config.js,scripts/**,eslint.config.mjs
# Doublons voulus, exclus de la mesure de duplication :
# - les scripts de mise à jour de la base reprennent exprès des morceaux de schema.sql
#   (ils servent aux bases déjà créées, qui ne relancent pas schema.sql) ;
# - i18n.js est une table de traductions « texte » : « texte » (toutes ses lignes se ressemblent).
sonar.cpd.exclusions=i18n.js,supabase/catalogue-depart.sql,supabase/prix-en-euros.sql,supabase/quitter-famille.sql,supabase/une-fois-par-jour.sql,supabase/semaines-terminees.sql,supabase/droits.sql,supabase/super-admin.sql

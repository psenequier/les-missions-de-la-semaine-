# Chaîne de sécurité, sur le modèle de celle de La Narbonnaise.
# Actions épinglées par empreinte SHA (version en commentaire) ; Dependabot
# propose les mises à jour chaque lundi.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verification:
    # JavaScript (ESLint + règles de sécurité : innerHTML, eval…), HTML (empreintes SRI, CSP),
    # et aucune clé secrète Supabase dans le site.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint et html-validate
        run: npm run lint
      - name: Aucune clé secrète Supabase dans le site
        run: node scripts/verifier-config.mjs

  base:
    # schema.sql sur un vrai Postgres : une famille ne lit ni ne modifie jamais les données
    # d'une autre, et le rôle super admin ne s'obtient pas depuis le site.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schéma, puis super-admin.sql une 2e fois (il doit pouvoir être relancé)
        run: psql -d ci -X -q -v ON_ERROR_STOP=1 -f supabase/tests/shim.sql -f supabase/schema.sql -f supabase/super-admin.sql
      - name: Tests de séparation des familles
        run: psql -d ci -X -q -v ON_ERROR_STOP=1 -f supabase/tests/separation-familles.sql
      - name: Témoin, une règle cassée exprès doit être détectée
        # Si les tests passent avec une règle qui laisse écrire chez les autres, ils ne protègent plus rien.
        run: |
          psql -d postgres -X -q -c "create database temoin"
          sed 's/for insert to authenticated with check (is_member(family_id) and created_by = auth.uid())/for insert to authenticated with check (true)/' \
            supabase/schema.sql > /tmp/temoin.sql
          grep -q "with check (true)" /tmp/temoin.sql || { echo "::error title=Témoin::la règle à casser n'a pas été trouvée dans schema.sql"; exit 1; }
          if psql -d temoin -X -q -v ON_ERROR_STOP=1 -f supabase/tests/shim.sql -f /tmp/temoin.sql -f supabase/super-admin.sql \
               -f supabase/tests/separation-familles.sql > /dev/null 2>&1; then
            echo "::error title=Témoin::les tests n'ont pas vu une règle cassée exprès"; exit 1
          fi
          echo "Le témoin a bien été détecté."

  interface:
    # Les écrans avec un faux Supabase : parcours complet, super admin, et une famille
    # « piégée » dont les textes tentent d'injecter du code (rien ne doit s'exécuter).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:interface

  sast:
    # Dépôt public : résultats publiés dans l'onglet Security. Dépôt privé (pas de Code scanning
    # sans GitHub Advanced Security) : mêmes analyses, résultats en annotations, et le job bloque.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      PUBLIC: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep, règles OWASP Top 10, JavaScript et secrets
        run: |
          pipx install semgrep==1.186.0
          semgrep scan --config p/owasp-top-ten --config p/javascript --config p/secrets --metrics off \
            --exclude node_modules --exclude tests/ui/mock.js \
            --sarif --output semgrep.sarif --json-output=semgrep.json --error --severity ERROR || {
            python3 -c "import json;[print(f\"::error file={r['path']},line={r['start']['line']},title=Semgrep::{r['check_id'].split('.')[-1]}\") for r in json.load(open('semgrep.json'))['results']]"
            exit 1
          }
      - name: CodeQL, préparation
        if: always()
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - name: CodeQL, analyse (injections, XSS, workflows)
        if: always()
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: codeql-resultats
          upload: ${{ env.PUBLIC == 'true' && 'always' || 'never' }}
      - name: CodeQL, aucune faille de niveau « erreur »
        if: always()
        run: python3 scripts/sarif-bloquant.py codeql-resultats
      - if: always() && env.PUBLIC == 'true' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependances:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique pour Gitleaks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
      - name: Aucun fichier .env commis
        run: "! git ls-files | grep -E '(^|/)\\.env$'"
      - name: Gitleaks (ligne de commande, licence libre)
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="HEAD" \
            --report-format json --report-path gitleaks.json || {
            echo "::error title=Gitleaks::$(python3 -c "import json;print('%0A'.join(f\"{f['RuleID']} {f['File']}:{f['StartLine']} ({f['Commit'][:7]})\" for f in json.load(open('gitleaks.json'))))")"
            exit 1
          }

  sonar:
    # SonarCloud (gratuit pour un dépôt public). Sans le secret SONAR_TOKEN, le job passe sans analyser.
    # Porte qualité bloquante seulement avec la variable SONAR_BLOQUANT=oui.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud::secret SONAR_TOKEN absent, analyse non lancée"
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >-
            -Dsonar.qualitygate.wait=${{ vars.SONAR_BLOQUANT == 'oui' && 'true' || 'false' }}
